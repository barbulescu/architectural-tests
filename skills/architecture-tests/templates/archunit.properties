# Where FreezingArchRule keeps the list of tolerated (pre-existing) violations.
# Commit this directory: it is the agreed baseline, reviewed like any other code.
freeze.store.default.path=archunit_store
freeze.store.default.allowStoreCreation=true
# Never silently accept new violations. To deliberately re-baseline, run the tests once with -Darchunit.freeze.refreeze=true
freeze.refreeze=false

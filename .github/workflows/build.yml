name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  libraries:
    name: Libraries (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build bundleSkill
      - name: Skill bundle is up to date
        run: |
          if [ -n "$(git status --porcelain -- skills/)" ]; then
            git status --short -- skills/
            echo "::error::skills/architecture-tests/rules/ is stale: run ./gradlew bundleSkill and commit the result"
            exit 1
          fi

  example-maven:
    name: Example shop-maven
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/shop-maven
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: examples/shop-maven/pom.xml
      - run: ./mvnw --batch-mode test

  example-gradle:
    name: Example shop-gradle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/shop-gradle
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
